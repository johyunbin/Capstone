<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .cover{padding-top:172px;}
  .tick{width:148px;height:10px;background:var(--navy);margin-bottom:34px;}
  .wordmark{
    font-size:266px;font-weight:900;letter-spacing:-0.035em;
    line-height:1;color:var(--ink-strong);
  }
  .wordmark .v{color:var(--navy);}
  .sub{
    font-size:45px;font-weight:600;color:var(--ink);
    line-height:1.42;margin-top:46px;letter-spacing:-0.02em;
  }
  .meta-row{margin-top:auto;}
  .crule{height:2px;background:var(--gray-line);margin-bottom:34px;}
  .meta{display:flex;justify-content:space-between;align-items:flex-end;}
  .meta .who{font-size:31px;font-weight:700;color:var(--ink);}
  .meta .who small{
    display:block;font-size:24px;font-weight:500;
    color:var(--muted);margin-top:10px;
  }
  .meta .org{text-align:right;font-size:29px;font-weight:700;color:var(--navy);}
  .meta .org small{
    display:block;font-size:23px;font-weight:500;
    color:var(--muted);margin-top:9px;
  }
</style></head><body>
<div class="slide"><div class="wrap cover">
  <div class="tick"></div>
  <div class="wordmark">속도는<span class="v">벡터</span></div>
  <div class="sub">벡터 분석 쿼리의 카디널리티 추정을 위한<br>분포 인지 표본 선택</div>
  <div class="meta-row">
    <div class="crule"></div>
    <div class="meta">
      <div class="who">박세은 · 강재현 · 조현빈 · 이동욱
        <small>지도교수 박광현</small></div>
      <div class="org">연세대학교
        <small>2026 캡스톤 디자인 · 속도는벡터</small></div>
    </div>
  </div>
</div></div>
</body></html>
