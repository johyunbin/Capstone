<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .flow{display:flex;align-items:center;justify-content:center;gap:24px;}
  .fbox{
    width:248px;height:180px;border:2.5px solid var(--gray-line);
    border-radius:18px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:38px;font-weight:700;color:var(--ink);
    line-height:1.25;
  }
  .fbox.on{
    background:var(--tint);border-color:var(--navy);color:var(--navy);
    font-weight:800;
  }
  .fres{display:flex;flex-direction:column;gap:20px;}
  .pill{
    width:262px;height:80px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:33px;font-weight:700;
  }
  .pill.good{background:var(--navy);color:#fff;}
  .pill.bad{background:var(--gray-track);color:var(--muted);}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">문제</div>
  <div class="title">데이터베이스는 미리 <span class="hl">결과 크기를 어림한다</span></div>
  <div class="body">
    <div class="flow">
      <div class="fbox">쿼리</div>
      <div class="arrow-lg">→</div>
      <div class="fbox on">카디널리티<br>추정</div>
      <div class="arrow-lg">→</div>
      <div class="fbox">실행 계획</div>
      <div class="arrow-lg">→</div>
      <div class="fres">
        <div class="pill good">빠른 쿼리</div>
        <div class="pill bad">느린 쿼리</div>
      </div>
    </div>
  </div>
  <div class="foot-tint">조건을 만족하는 행이 <b>몇 개일지</b> 어림하는 것이 카디널리티 —
    이 어림이 <b>틀리면</b> 잘못된 실행 계획을 세워 쿼리가 느려진다</div>
</div></div>
</body></html>
