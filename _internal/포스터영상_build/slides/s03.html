<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .fixed{display:flex;gap:46px;}
  .fixed .card{
    flex:1;padding:64px 60px;display:flex;flex-direction:column;
    align-items:flex-start;
  }
  .bignum{
    font-size:236px;font-weight:900;color:var(--navy);
    line-height:0.9;letter-spacing:-0.03em;
  }
  .bignum .u{font-size:120px;}
  .fixed .name{
    font-size:42px;font-weight:800;color:var(--ink);margin-top:26px;
  }
  .fixed .desc{
    font-size:30px;font-weight:500;color:var(--muted);margin-top:12px;
  }
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">기존의 한계</div>
  <div class="title">기존 방식은 데이터와 무관한 <span class="hl">고정 비율</span></div>
  <div class="body">
    <div class="fixed">
      <div class="card soft">
        <div class="bignum">33<span class="u">%</span></div>
        <div class="name">pgvector</div>
        <div class="desc">데이터가 어떻든 늘 전체의 33%로 가정</div>
      </div>
      <div class="card soft">
        <div class="bignum">100<span class="u">%</span></div>
        <div class="name">DuckDB</div>
        <div class="desc">데이터가 어떻든 늘 100%로 가정</div>
      </div>
    </div>
  </div>
  <div class="foot-tint">실제 데이터의 분포를 보지 않으니, 추정이 <b>크게 어긋날 수밖에 없다</b></div>
</div></div>
</body></html>
