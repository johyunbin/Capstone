<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .pipe{display:flex;align-items:stretch;justify-content:center;gap:22px;}
  .pbox{
    width:472px;min-height:446px;border:2.5px solid var(--gray-line);
    border-radius:20px;padding:36px 30px;
    display:flex;flex-direction:column;align-items:center;position:relative;
  }
  .pbox.mid{border-color:var(--navy);border-width:3.5px;}
  .plabel{font-size:33px;font-weight:800;color:var(--ink);}
  .pbox.mid .plabel{color:var(--navy);}
  .tab{
    position:absolute;top:-25px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;font-size:22px;font-weight:700;
    padding:10px 28px;border-radius:999px;white-space:nowrap;
  }
  .gfx{flex:1;display:flex;align-items:center;justify-content:center;}
  .subs{display:flex;gap:16px;width:100%;margin-top:auto;}
  .subp{flex:1;border-radius:14px;padding:20px 8px 22px;text-align:center;}
  .subp.r{background:var(--gray-bg);}
  .subp.d{background:var(--tint);border:2.5px solid var(--navy);}
  .slbl{font-size:24px;font-weight:700;margin-bottom:12px;}
  .subp.r .slbl{color:var(--faint);}
  .subp.d .slbl{color:var(--navy);font-weight:800;}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">우리의 접근</div>
  <div class="title">추정 알고리즘은 그대로, <span class="hl">표본 뽑는 방식만 바꿨다</span></div>
  <div class="body">
    <div class="pipe">
      <div class="pbox">
        <div class="plabel">데이터</div>
        <div class="gfx">
          <svg width="300" height="166" viewBox="0 0 300 166">
            <g fill="#1E3A5F">
              <circle cx="84" cy="56" r="9"/><circle cx="120" cy="40" r="9"/>
              <circle cx="150" cy="72" r="9"/><circle cx="178" cy="48" r="9"/>
              <circle cx="132" cy="100" r="9"/><circle cx="104" cy="82" r="9"/>
              <circle cx="196" cy="92" r="9"/><circle cx="162" cy="124" r="9"/>
              <circle cx="216" cy="62" r="9"/><circle cx="74" cy="116" r="9"/>
              <circle cx="222" cy="120" r="9"/><circle cx="118" cy="138" r="9"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="arrow-lg">→</div>
      <div class="pbox mid">
        <div class="tab">우리가 바꾼 곳</div>
        <div class="plabel">표본 뽑기</div>
        <div class="subs">
          <div class="subp r">
            <div class="slbl">무작위</div>
            <svg width="156" height="92" viewBox="0 0 156 92">
              <g fill="#AEB4BD">
                <circle cx="74" cy="40" r="8"/><circle cx="92" cy="32" r="8"/>
                <circle cx="84" cy="54" r="8"/><circle cx="100" cy="50" r="8"/>
                <circle cx="68" cy="60" r="8"/>
              </g>
            </svg>
          </div>
          <div class="subp d">
            <div class="slbl">분포 인지</div>
            <svg width="156" height="92" viewBox="0 0 156 92">
              <g fill="#1E3A5F">
                <circle cx="26" cy="58" r="8"/><circle cx="52" cy="40" r="8"/>
                <circle cx="78" cy="30" r="8"/><circle cx="104" cy="40" r="8"/>
                <circle cx="130" cy="58" r="8"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
      <div class="arrow-lg">→</div>
      <div class="pbox">
        <div class="plabel">카디널리티 추정</div>
        <div class="gfx">
          <svg width="290" height="166" viewBox="0 0 290 166">
            <g>
              <rect x="34" y="86" width="44" height="64" rx="5" fill="#6F8EB8"/>
              <rect x="94" y="44" width="44" height="106" rx="5" fill="#1E3A5F"/>
              <rect x="154" y="74" width="44" height="76" rx="5" fill="#6F8EB8"/>
              <rect x="214" y="104" width="44" height="46" rx="5" fill="#6F8EB8"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <div class="foot-tint">논문 <b>Exqutor</b>의 추정 알고리즘은 그대로 인정 — 우리가 손댄 곳은 <b>표본 뽑는 방식 하나</b></div>
</div></div>
</body></html>
