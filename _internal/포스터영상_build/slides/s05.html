<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .dist{display:flex;gap:42px;}
  .dpanel{flex:1;border-radius:20px;padding:38px 40px 32px;}
  .dpanel.rand{background:var(--gray-bg);border:2px solid var(--gray-line);}
  .dpanel.aware{background:var(--tint);border:3px solid var(--navy);}
  .dhead{font-size:32px;font-weight:800;}
  .dpanel.rand .dhead{color:var(--muted);}
  .dpanel.aware .dhead{color:var(--navy);}
  .chart{display:flex;align-items:flex-end;gap:11px;height:312px;margin-top:30px;}
  .col{flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;}
  .dot{width:24px;height:24px;border-radius:50%;
    background:var(--navy);margin-bottom:12px;}
  .dot.off{visibility:hidden;}
  .bar{width:100%;border-radius:7px 7px 0 0;}
  .rand .bar{background:var(--gray-cool);}
  .aware .bar{background:var(--blue-mid);}
  .dcap{font-size:25px;font-weight:700;margin-top:24px;text-align:center;}
  .dpanel.rand .dcap{color:var(--muted);}
  .dpanel.aware .dcap{color:var(--navy);}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">왜 분포 인지인가</div>
  <div class="title">쏠린 데이터에서, <span class="hl">무작위는 쏠린 곳만 뽑는다</span></div>
  <div class="body">
    <div class="dist">
      <div class="dpanel rand">
        <div class="dhead">기존 방식 · 무작위</div>
        <div class="chart">
          <div class="col"><span class="dot off"></span><div class="bar" style="height:30px"></div></div>
          <div class="col"><span class="dot off"></span><div class="bar" style="height:56px"></div></div>
          <div class="col"><span class="dot off"></span><div class="bar" style="height:96px"></div></div>
          <div class="col"><span class="dot off"></span><div class="bar" style="height:142px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:178px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:204px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:166px"></div></div>
          <div class="col"><span class="dot off"></span><div class="bar" style="height:124px"></div></div>
          <div class="col"><span class="dot off"></span><div class="bar" style="height:88px"></div></div>
          <div class="col"><span class="dot off"></span><div class="bar" style="height:56px"></div></div>
          <div class="col"><span class="dot off"></span><div class="bar" style="height:32px"></div></div>
        </div>
        <div class="dcap">표본이 봉우리에만 몰린다</div>
      </div>
      <div class="dpanel aware">
        <div class="dhead">분포 인지 표본 추출</div>
        <div class="chart">
          <div class="col"><span class="dot"></span><div class="bar" style="height:30px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:56px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:96px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:142px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:178px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:204px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:166px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:124px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:88px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:56px"></div></div>
          <div class="col"><span class="dot"></span><div class="bar" style="height:32px"></div></div>
        </div>
        <div class="dcap">드문 곳까지 골고루 들어온다</div>
      </div>
    </div>
  </div>
  <div class="foot-tint">분포를 반영하면 드문 곳까지 표본에 들어와 <b>추정이 한결 정확해진다</b></div>
</div></div>
</body></html>
