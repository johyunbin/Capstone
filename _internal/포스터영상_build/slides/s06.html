<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .step{
    padding:40px 32px 44px;display:flex;flex-direction:column;
    align-items:center;text-align:center;
  }
  .snum{width:64px;height:64px;font-size:32px;}
  .sname{font-size:37px;font-weight:800;color:var(--ink);margin:22px 0 4px;}
  .card.hl .sname{color:var(--navy);}
  .sgfx{
    height:158px;display:flex;align-items:center;justify-content:center;
    margin:16px 0 18px;
  }
  .sdesc{font-size:25px;color:var(--muted);line-height:1.5;font-weight:500;}
  .jbox{
    border:2.5px solid var(--navy);border-radius:12px;background:#fff;
    font-size:23px;font-weight:700;color:var(--navy);padding:14px 18px;
  }
  .javg{
    background:var(--navy);color:#fff;border-radius:12px;
    font-size:25px;font-weight:800;padding:16px 24px;
  }
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">우리 방법</div>
  <div class="title">분포를 반영해 표본을 뽑는 <span class="hl">세 단계</span></div>
  <div class="body">
    <div class="cols-3">
      <div class="card step">
        <div class="badge snum">1</div>
        <div class="sname">분포 파악</div>
        <div class="sgfx">
          <svg width="200" height="150" viewBox="0 0 200 150">
            <g fill="none" stroke="#1E3A5F" stroke-width="3">
              <ellipse cx="58" cy="46" rx="44" ry="34"/>
              <ellipse cx="146" cy="46" rx="44" ry="34"/>
              <ellipse cx="58" cy="110" rx="44" ry="34"/>
              <ellipse cx="146" cy="110" rx="44" ry="34"/>
            </g>
            <g fill="#6F8EB8">
              <circle cx="48" cy="40" r="6"/><circle cx="68" cy="52" r="6"/><circle cx="58" cy="36" r="6"/>
              <circle cx="136" cy="40" r="6"/><circle cx="156" cy="52" r="6"/><circle cx="146" cy="58" r="6"/>
              <circle cx="48" cy="104" r="6"/><circle cx="68" cy="116" r="6"/><circle cx="58" cy="100" r="6"/>
              <circle cx="136" cy="104" r="6"/><circle cx="156" cy="116" r="6"/><circle cx="146" cy="122" r="6"/>
            </g>
          </svg>
        </div>
        <div class="sdesc">데이터를 비슷한 것끼리<br><b>20개 그룹</b>으로 나눈다</div>
      </div>
      <div class="card step">
        <div class="badge snum">2</div>
        <div class="sname">표본 추출</div>
        <div class="sgfx">
          <svg width="200" height="150" viewBox="0 0 200 150">
            <g fill="none" stroke="#C6CDD7" stroke-width="3">
              <ellipse cx="58" cy="46" rx="44" ry="34"/>
              <ellipse cx="146" cy="46" rx="44" ry="34"/>
              <ellipse cx="58" cy="110" rx="44" ry="34"/>
              <ellipse cx="146" cy="110" rx="44" ry="34"/>
            </g>
            <g fill="#1E3A5F">
              <circle cx="58" cy="46" r="11"/><circle cx="146" cy="46" r="11"/>
              <circle cx="58" cy="110" r="11"/><circle cx="146" cy="110" r="11"/>
            </g>
          </svg>
        </div>
        <div class="sdesc">각 그룹에서<br>표본을 <b>골고루</b> 뽑는다</div>
      </div>
      <div class="card hl step">
        <div class="badge snum">3</div>
        <div class="sname">결합</div>
        <div class="sgfx">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="display:flex;flex-direction:column;gap:10px;">
              <div class="jbox">논문 추정값</div>
              <div class="jbox">우리 추정값</div>
            </div>
            <div class="arrow-lg" style="font-size:40px;">→</div>
            <div class="javg">평균</div>
          </div>
        </div>
        <div class="sdesc">두 추정값을<br><b>평균</b> 낸다</div>
      </div>
    </div>
  </div>
  <div class="foot-tint">추정 알고리즘과 표본 크기는 <b>논문 그대로</b> — 표본을 뽑는 방식만 바꾼다</div>
</div></div>
</body></html>
