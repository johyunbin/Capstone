<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .way{padding:36px 32px 40px;display:flex;flex-direction:column;
    align-items:center;text-align:center;}
  .weye{font-size:23px;font-weight:600;color:var(--muted);}
  .card.hl .weye{color:var(--navy);}
  .wname{font-size:40px;font-weight:800;color:var(--ink);margin:8px 0 2px;}
  .card.hl .wname{color:var(--navy);}
  .wgfx{height:150px;display:flex;align-items:center;justify-content:center;
    margin:16px 0 16px;}
  .wdesc{font-size:24px;color:var(--muted);line-height:1.5;font-weight:500;}
  .merge{display:flex;align-items:center;gap:14px;}
  .mc{width:84px;height:84px;border-radius:50%;border:3px solid var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;color:var(--navy);background:#fff;}
  .mplus{font-size:40px;font-weight:800;color:var(--blue-mid);}
  .mres{background:var(--navy);color:#fff;border-radius:14px;
    font-size:25px;font-weight:800;padding:18px 22px;}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">비교 설계</div>
  <div class="title">세 가지 방식을 <span class="hl">같은 조건으로 비교</span>했다</div>
  <div class="body">
    <div class="cols-3">
      <div class="card way">
        <div class="weye">비교의 기준</div>
        <div class="wname">기존 방식</div>
        <div class="wgfx">
          <svg width="190" height="120" viewBox="0 0 190 120">
            <g fill="#AEB4BD">
              <circle cx="92" cy="46" r="9"/><circle cx="110" cy="38" r="9"/>
              <circle cx="100" cy="62" r="9"/><circle cx="118" cy="58" r="9"/>
              <circle cx="84" cy="70" r="9"/><circle cx="104" cy="80" r="9"/>
            </g>
          </svg>
        </div>
        <div class="wdesc">논문 그대로의<br>무작위 표본 추출</div>
      </div>
      <div class="card way">
        <div class="weye">우리 표본만 사용</div>
        <div class="wname">완전 대체</div>
        <div class="wgfx">
          <svg width="190" height="120" viewBox="0 0 190 120">
            <g fill="#1E3A5F">
              <circle cx="34" cy="68" r="9"/><circle cx="64" cy="48" r="9"/>
              <circle cx="95" cy="38" r="9"/><circle cx="126" cy="48" r="9"/>
              <circle cx="156" cy="68" r="9"/>
            </g>
          </svg>
        </div>
        <div class="wdesc">무작위 표본을 우리<br>표본으로 통째 교체</div>
      </div>
      <div class="card hl way">
        <div class="weye">두 추정값 평균</div>
        <div class="wname">결합</div>
        <div class="wgfx">
          <div class="merge">
            <div class="mc">논문</div>
            <div class="mplus">+</div>
            <div class="mc">우리</div>
            <div class="arrow-lg" style="font-size:36px;">→</div>
            <div class="mres">평균</div>
          </div>
        </div>
        <div class="wdesc">두 추정값을 평균 내어<br>함께 사용</div>
      </div>
    </div>
  </div>
  <div class="foot-tint">한 번의 측정에서 세 방식을 <b>똑같은 데이터·똑같은 조건</b>으로 동시 비교</div>
</div></div>
</body></html>
