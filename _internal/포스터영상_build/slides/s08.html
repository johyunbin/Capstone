<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .scope{display:flex;gap:64px;align-items:center;}
  .bigwrap{flex:0 0 660px;text-align:center;}
  .bigwrap .stat{font-size:282px;}
  .bigwrap .lbl{font-size:40px;font-weight:700;color:var(--ink);margin-top:8px;}
  .axes{flex:1;display:flex;flex-direction:column;}
  .axis{
    display:flex;align-items:baseline;gap:22px;
    padding:19px 0;border-bottom:2px solid var(--gray-line);
  }
  .axis:last-child{border-bottom:none;}
  .axis .an{font-size:27px;font-weight:700;color:var(--muted);flex:0 0 244px;}
  .axis .av{font-size:33px;font-weight:800;color:var(--navy);}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">검증 범위</div>
  <div class="title">다섯 축을 교차해 — <span class="hl">폭넓게 검증했다</span></div>
  <div class="body">
    <div class="scope">
      <div class="bigwrap">
        <div class="stat">1508</div>
        <div class="lbl">번의 측정</div>
      </div>
      <div class="axes">
        <div class="axis"><div class="an">데이터셋</div><div class="av">9종 · 96~1024차원</div></div>
        <div class="axis"><div class="an">데이터 규모</div><div class="av">10만 · 100만 · 1000만 행</div></div>
        <div class="axis"><div class="an">쿼리 조건</div><div class="av">0.1% · 1% · 10%</div></div>
        <div class="axis"><div class="an">표본 선택 방법</div><div class="av">16가지</div></div>
        <div class="axis"><div class="an">그룹 수</div><div class="av">10 · 20 · 30개</div></div>
      </div>
    </div>
  </div>
  <div class="foot-tint">데이터셋은 96차원부터 1024차원까지 — <b>단일 벡터와 다중 벡터를 아우른다</b></div>
</div></div>
</body></html>
