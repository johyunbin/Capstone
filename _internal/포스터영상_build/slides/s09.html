<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .result{display:flex;gap:70px;align-items:center;}
  .rmain{flex:0 0 740px;}
  .rmain .stat{font-size:300px;}
  .rmain .stat .u{font-size:0.42em;}
  .rbar{
    height:30px;background:var(--gray-track);border-radius:999px;
    margin:18px 0 24px;overflow:hidden;
  }
  .rbar i{display:block;height:100%;width:89.1%;background:var(--navy);}
  .rsub{font-size:28px;color:var(--muted);font-weight:500;line-height:1.6;}
  .rsub b{color:var(--navy);}
  .rside{flex:1;}
  .rh{font-size:26px;color:var(--muted);font-weight:600;
    margin-bottom:30px;letter-spacing:0.02em;}
  .metric{margin-bottom:38px;}
  .metric:last-child{margin-bottom:0;}
  .ml{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:13px;}
  .ml span{font-size:30px;font-weight:700;color:var(--ink);}
  .ml b{font-size:52px;font-weight:900;color:var(--navy);}
  .mt{height:24px;background:var(--gray-track);border-radius:999px;overflow:hidden;}
  .mt i{display:block;height:100%;background:var(--blue-mid);}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">핵심 결과</div>
  <div class="title">결합 방식이 추정 오차를 <span class="hl">89.1%에서 줄였다</span></div>
  <div class="body">
    <div class="result">
      <div class="rmain">
        <div class="stat">89.1<span class="u">%</span></div>
        <div class="rbar"><i></i></div>
        <div class="rsub">결합 방식이 기존 무작위 방식보다 더 정확한 비율<br>
          <b>1508번 중 1344번</b> 더 정확 · 추정 오차 중앙값 <b>약 4.4% 감소</b></div>
      </div>
      <div class="rside">
        <div class="rh">신호의 견고함</div>
        <div class="metric">
          <div class="ml"><span>통계적으로 의미 있는 개선</span><b>65%</b></div>
          <div class="mt"><i style="width:65%"></i></div>
        </div>
        <div class="metric">
          <div class="ml"><span>개선 폭이 큰 경우</span><b>72%</b></div>
          <div class="mt"><i style="width:72%"></i></div>
        </div>
      </div>
    </div>
  </div>
</div></div>
</body></html>
