<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .bars{display:flex;flex-direction:column;gap:52px;}
  .brow .bl{
    display:flex;align-items:baseline;gap:20px;margin-bottom:16px;
  }
  .brow .bname{font-size:36px;font-weight:800;}
  .brow .bnote{font-size:25px;font-weight:500;color:var(--muted);}
  .brow.b1 .bname{color:var(--muted);}
  .brow.b2 .bname{color:var(--navy);}
  .btrack{height:92px;background:var(--gray-track);border-radius:16px;}
  .bfill{
    height:100%;border-radius:16px;display:flex;align-items:center;
    justify-content:flex-end;padding-right:34px;
    font-size:46px;font-weight:900;color:#fff;
  }
  .b1 .bfill{width:35.2%;background:var(--blue-mid);}
  .b2 .bfill{width:89.1%;background:var(--navy);}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">왜 결합인가</div>
  <div class="title">완전 대체는 불안정 — <span class="hl">결합이 답이다</span></div>
  <div class="body">
    <div class="bars">
      <div class="brow b1">
        <div class="bl"><span class="bname">완전 대체</span>
          <span class="bnote">무작위를 우리 표본으로 통째 교체</span></div>
        <div class="btrack"><div class="bfill">35.2%</div></div>
      </div>
      <div class="brow b2">
        <div class="bl"><span class="bname">결합</span>
          <span class="bnote">두 추정값을 평균</span></div>
        <div class="btrack"><div class="bfill">89.1%</div></div>
      </div>
    </div>
  </div>
  <div class="foot-tint">통째 교체는 우리 방법이 약할 때 크게 나빠진다 — 결합하면 논문 방식이 안전망이 되어,
    <b>완전 대체와 직접 맞붙여도 96.5%에서 우월</b></div>
</div></div>
</body></html>
