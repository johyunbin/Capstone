<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .mp{padding:36px 34px 40px;display:flex;flex-direction:column;}
  .mph{font-size:25px;font-weight:600;color:var(--muted);}
  .mpt{font-size:33px;font-weight:800;color:var(--navy);margin:5px 0 30px;}
  .mb{margin-bottom:22px;}
  .mb:last-child{margin-bottom:0;}
  .mbl{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:9px;}
  .mbl span{font-size:24px;font-weight:600;color:var(--ink);}
  .mbl b{font-size:30px;font-weight:900;color:var(--blue-mid);}
  .mb.on .mbl b{color:var(--navy);font-size:34px;}
  .mb.on .mbl span{color:var(--navy);font-weight:800;}
  .mbt{height:20px;background:var(--gray-track);border-radius:999px;overflow:hidden;}
  .mbt i{display:block;height:100%;background:var(--blue-mid);}
  .mb.on .mbt i{background:var(--navy);}
  .dual{display:flex;flex-direction:column;gap:30px;justify-content:center;
    flex:1;}
  .dn .dnl{font-size:25px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .dn .dnv{font-size:84px;font-weight:900;color:var(--navy);line-height:1;}
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">일관성</div>
  <div class="title">선택도·데이터 구조·그룹 수 — <span class="hl">모든 조건에서 일관</span></div>
  <div class="body">
    <div class="cols-3">
      <div class="card mp">
        <div class="mph">쿼리 조건</div>
        <div class="mpt">넓을수록 더 우월</div>
        <div class="mb"><div class="mbl"><span>좁음 0.1%</span><b>83.3%</b></div>
          <div class="mbt"><i style="width:52.3%"></i></div></div>
        <div class="mb"><div class="mbl"><span>중간 1%</span><b>87.6%</b></div>
          <div class="mbt"><i style="width:64.6%"></i></div></div>
        <div class="mb"><div class="mbl"><span>넓음 10%</span><b>97.5%</b></div>
          <div class="mbt"><i style="width:92.9%"></i></div></div>
      </div>
      <div class="card mp">
        <div class="mph">데이터 구조</div>
        <div class="mpt">단일·다중 거의 동일</div>
        <div class="dual">
          <div class="dn"><div class="dnl">단일 벡터</div><div class="dnv">89.1%</div></div>
          <div class="dn"><div class="dnl">다중 벡터</div><div class="dnv">89.2%</div></div>
        </div>
      </div>
      <div class="card mp">
        <div class="mph">그룹 수</div>
        <div class="mpt">20개 그룹이 최적</div>
        <div class="mb"><div class="mbl"><span>10개</span><b>83.6%</b></div>
          <div class="mbt"><i style="width:53.1%"></i></div></div>
        <div class="mb on"><div class="mbl"><span>20개</span><b>89.8%</b></div>
          <div class="mbt"><i style="width:70.9%"></i></div></div>
        <div class="mb"><div class="mbl"><span>30개</span><b>85.9%</b></div>
          <div class="mbt"><i style="width:59.7%"></i></div></div>
      </div>
    </div>
  </div>
  <div class="foot-tint">세 패널 수치는 모두 <b>결합 방식이 기존 방식을 이긴 비율</b> — 조건이 달라져도 개선이 일관된다</div>
</div></div>
</body></html>
