<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .concl{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .cc{padding:34px 36px;display:flex;gap:24px;align-items:flex-start;}
  .ccn{width:58px;height:58px;font-size:30px;flex:none;}
  .cct{font-size:30px;font-weight:700;line-height:1.42;color:var(--ink);}
  .cct b{color:var(--navy);font-weight:800;}
  .nextbar{
    margin-top:26px;background:var(--navy);color:#fff;border-radius:16px;
    padding:24px 36px;font-size:29px;font-weight:600;
    display:flex;align-items:center;gap:18px;
  }
  .nextbar .nlbl{
    background:rgba(255,255,255,0.16);border-radius:999px;
    padding:7px 22px;font-size:24px;font-weight:700;flex:none;
  }
</style></head><body>
<div class="slide"><div class="wrap">
  <div class="eyebrow">결론</div>
  <div class="title">표본 뽑는 방식만 바꿔 — <span class="hl">추정이 더 정확해졌다</span></div>
  <div class="body">
    <div class="concl">
      <div class="card cc">
        <div class="badge ccn">1</div>
        <div class="cct">분포를 반영한 표본 선택이 추정 오차를 <b>89.1%에서 줄였다</b></div>
      </div>
      <div class="card cc">
        <div class="badge ccn">2</div>
        <div class="cct">통째 교체는 불안정 — <b>두 추정값의 결합</b>이 답이다</div>
      </div>
      <div class="card cc">
        <div class="badge ccn">3</div>
        <div class="cct">선택도·데이터 구조·그룹 수 — <b>모든 조건에서 일관</b>되게 우월</div>
      </div>
      <div class="card cc">
        <div class="badge ccn">4</div>
        <div class="cct">데이터 유형에 따라 <b>방법을 자동으로 고르는 방식</b>을 제안</div>
      </div>
    </div>
    <div class="nextbar">
      <span class="nlbl">다음 단계</span>
      <span>다른 데이터베이스 엔진에서도 같은 효과가 나는지 검증해 나간다</span>
    </div>
  </div>
</div></div>
</body></html>
