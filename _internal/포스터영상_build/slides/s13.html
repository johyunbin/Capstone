<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../design.css">
<link rel="stylesheet" href="../slides.css">
<style>
  .end{justify-content:center;}
  .etick{width:148px;height:10px;background:var(--navy);margin-bottom:38px;}
  .ethanks{
    font-size:228px;font-weight:900;color:var(--ink-strong);
    letter-spacing:-0.035em;line-height:1;
  }
  .eline{
    font-size:38px;font-weight:600;color:var(--ink);
    margin-top:48px;letter-spacing:-0.02em;
  }
  .emeta{font-size:30px;font-weight:600;color:var(--muted);margin-top:20px;}
  .eposter{
    display:inline-flex;align-items:center;gap:14px;margin-top:34px;
    background:var(--tint);border-radius:999px;padding:14px 30px;
    font-size:27px;font-weight:600;color:var(--navy);
  }
</style></head><body>
<div class="slide"><div class="wrap end">
  <div class="etick"></div>
  <div class="ethanks">감사합니다</div>
  <div class="eline">추정 알고리즘은 그대로 두고, 표본 뽑는 방식만 바꾼 결과입니다</div>
  <div class="emeta">속도는벡터 · 박세은 · 강재현 · 조현빈 · 이동욱 · 2026 캡스톤 디자인</div>
  <div class="eposter">자세한 내용은 전시회 포스터에서 만나 보세요</div>
</div></div>
</body></html>
