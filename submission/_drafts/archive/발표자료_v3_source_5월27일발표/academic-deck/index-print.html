<script type="application/json" id="speaker-notes">
[
"안녕하세요. 속도는벡터 팀입니다. 저희는 한 학기 동안 벡터 카디널리티 추정에서, 단순 균등 표본보다 분포를 인지하는 stratified sampling이 얼마나 가치 있는지를 정량화하는 연구를 진행했습니다. 결론부터 말씀드리면, learning-free 방법으로는 Hilbert curve가 1순위, production 환경에서는 MiniBatch K-means가 답이라는 두 가지 기여를 도출했습니다. 발표는 약 12분 정도 진행됩니다.",
"오늘 발표 구성입니다. 먼저 1번 문제 정의와 2번 선행 연구 Exqutor의 두 보완책을 본 다음, 3번 우리 접근 — Skew-Aware Sampling을 소개합니다. 4번부터 6번까지가 핵심 결과 — 진단 RQ1, distribution-aware RQ2, distribution-agnostic RQ3 입니다. 7번 Cross-scale 외적 타당성, 8번 메커니즘, 9번 effect size 정직성을 살핀 다음, 10번 한계와 후속 과제로 마무리합니다.",
"문제는 단순합니다. 벡터 range query의 카디널리티를 잘못 추정하면 옵티마이저가 잘못된 실행 계획을 선택하고, 그 결과 latency가 수십 배까지 증가합니다. 화면 좌측의 33.3%, 50.0%, 100% 같은 기존 시스템 추정 비율들은 selectivity 분포를 단일 비율로 처리하기 때문에, 정확도와 안정성을 동시에 잃습니다. 우리가 풀고자 한 것은 ‘기술적으로 좋은 추정’과 ‘실행 계획에 진짜 도움 되는 추정’의 간극을 메우는 것입니다.",
"선행 연구 Exqutor는 이 문제에 두 가지 보완책을 제안합니다. 첫째 ECQO는 1에서 2 ms 안에 빠른 견적을 내주고, 둘째 Adaptive Sampling은 1000배 가량의 비용 감소를 보여줍니다. 다만 시스템별 전체 실행 비용은 pgvector 1000배, VBASE 10000배, DuckDB 1.5에서 37배로 큰 격차가 있습니다. 따라서 단순한 sampling 비용 절감만으로는 부족하고, 분포 인지 자체의 가치를 따로 정량화해야 합니다.",
"우리 접근은 RQ1 진단, RQ2 distribution-aware, RQ3 distribution-agnostic 세 단계입니다. RQ1은 skew가 추정 오차에 진짜 영향을 주는지 통계적으로 확정합니다. RQ2는 분포를 정확히 알 때 oracle 환경에서 어떤 stratification이 최적인지 비교하고, RQ3는 분포를 모르는 실전 상황에서 어떤 방법이 채택 가능한지 본격 평가합니다. 한 줄 요약은 — 분포가 펼쳐 있을 때 cardinality 정확도와 안정성을 명확히 계량한다 입니다.",
"RQ1 진단입니다. DEEP-KM20에서 Spearman ρ는 마이너스 0.680, 95% 신뢰구간 마이너스 0.800에서 마이너스 0.440. 0을 포함하지 않습니다. 즉 selectivity가 커질수록 KM20의 추정 오차가 일관되게 줄어드는 단조 관계가 통계적으로 확정됩니다. 우측 scatter는 5 seed × 6 selectivity 값을 보여주고, 빨간 trend line이 단조성의 시각적 증거입니다. 결론 — BERN은 selectivity가 높을수록 오히려 더 부정확합니다.",
"RQ2 distribution-aware입니다. 5가지 allocation × 8가지 sample size, 총 40개 셀에서 KM20이 BERN을 모두 이깁니다. 40 대 0. 추가로 anti-Neyman counterfactual을 돌렸을 때 — 일부러 잘못된 비율로 할당했을 때 — DEEP은 5.21% 오차 증가, SIFT는 9.49% 증가, 모두 신뢰구간이 0을 제외합니다. 분포 인지가 도움이 되지 않는 상황은 인위적으로 만들어야만 가능했고, 이는 ‘분포는 정말 도움이 되는가’라는 원시 의문에 대한 답이 됩니다.",
"RQ3 distribution-agnostic입니다. 분포를 모를 때 22개 방법을 1M에서, 16개 방법을 8M에서 비교합니다. 화면의 막대 그래프는 effect size 순위이며, 별표 4개가 paired bootstrap CI 0 제외 robust 4강 — Hilbert curve, MiniBatch K-means, Hybrid, HDBSCAN 입니다. 색상은 카테고리를 나타냅니다 — learning-free, learned offline, online weight, oracle, negative. 결론은 — 분포를 모르는 실전에서도 4가지 방법이 일관된 가치를 보입니다.",
"첫 번째 기여 — Hilbert curve가 learning-free 방법 중 1순위입니다. Cohen's d 마이너스 0.156. 메커니즘은 inverse Manhattan 거리 1.000이라는 완벽한 보존입니다. Z-order는 1.992로 두 배 이상 왜곡됩니다. stratum 단위 compactness가 1.25배에서 2.54배까지 좋아지면서, 학습 없이도 분포 인지 효과의 대부분을 끌어냅니다.",
"두 번째 기여 — MiniBatch K-means가 production-ready입니다. 화면의 1,189배는 N=1M에서의 학습 시간 단축입니다. partial_fit ARI는 1.000, 즉 full K-means와 완전히 동일한 클러스터 결과를 냅니다. 정확도 손실 없이 학습 비용만 세 자리수 이상 줄어들며, 이것이 실전 채택의 결정적 근거입니다.",
"세 번째 기여는 negative control입니다. Distance-Shell의 d는 플러스 0.49, Importance Sampling은 0.5에서 0.7. 둘 다 hurt-medium 영역입니다. 분할이 항상 도움이 되는 것은 아니라는 점을 보여줍니다 — 적절한 분할만이 효과를 만들고, 그렇지 않은 분할은 오히려 분산을 키웁니다. 이것이 KM20과 Hilbert가 특별한 이유입니다.",
"다섯 번째 핵심 기여는 HDBSCAN — density-based clustering 입니다. SIFT mid-selectivity, sampling rate 0.10에서 마이너스 3.99 퍼센트, 신뢰구간 마이너스 5.34 에서 마이너스 2.12. 22개 method 전체 중 1위입니다. 메커니즘은 mid-sel 의 sweet spot — selectivity 1퍼센트는 너무 좁아 noise, 50퍼센트는 너무 넓어 약화됩니다. SIFT 의 더 큰 skew 환경에서 density 인식 분할이 oracle 에 근접한 효과를 보이며, 이것이 4강 — Hilbert, MiniBatch, Hybrid, HDBSCAN — 의 마지막 핵심입니다.",
"이제 외적 타당성을 위해 8M으로 확장한 결과입니다. heatmap은 16개 method × DEEP_1M / DEEP_8M 입니다. 핵심 — ranking은 일관되게 유지됩니다. 그러나 DEEP_8M의 mid-selectivity 구간에서는 1M에서 본 단조성이 그대로 이전되지 않습니다. 추가 분석에서 단조 증가 셀 0개, 감소 2개 — 즉 sample_size 385라는 검증력 한계 가능성이 있습니다. 결론 — 순위는 robust, gradient 패턴은 규모에 따라 미묘합니다.",
"메커니즘 두 가지를 정리합니다. 첫째, locality 측면 — Hilbert의 inverse Manhattan 1.000 vs Z-order 1.992로, 거리 보존이 effect size로 직접 연결됩니다. 둘째, redundancy 측면 — KM20과 MiniBatch는 ARI 1.000으로 동일한 클러스터 구조를 만들기 때문에, 둘을 합쳐도 추가 이득이 거의 없습니다. 즉 두 방법은 동일 신호를 다른 비용으로 추출하는 관계 — production에서는 MiniBatch가 우위입니다.",
"Effect size 정직성입니다. Hilbert의 DEFF는 0.338, ESS는 2,325 — 단순 random sampling 대비 약 6배의 effective sample size 효과입니다. 다만 평균 effect size d는 약 0.3 — practical small. 어려운 query 군 Q4_hard에서는 spread vs difficulty ρ가 0.78로 강한 양의 상관을 보입니다. 즉 small effect 자체가 cluster method의 근거가 되지는 않지만, per-query routing 가치는 분명합니다.",
"한계와 후속 과제 네 가지입니다. L1 multi-table join 시나리오 미검증, L2 vector.c 코어 통합 잔존, L3 distribution shift에 대한 시간축 강건성, L4 online streaming setting 확장. 이 네 가지가 자연스러운 후속 연구 출발점입니다.",
"감사합니다. 코드와 실험 로그는 GitHub 저장소 johyunbin/Capstone에 공개되어 있고, 본 분석 대상 논문은 arXiv 2512.09695v2 입니다. 질문 환영합니다."
]

<script>
// Recharts' ResponsiveContainer caches initial 0x0 measurements when slides
// start hidden inside deck-stage's shadow DOM. Force a resize on every slide
// change AND on initial mount so charts pick up real dimensions.
(function () {
  const fire = () => {
    requestAnimationFrame(() => {
      window.dispatchEvent(new Event('resize'));
      setTimeout(() => window.dispatchEvent(new Event('resize')), 60);
      setTimeout(() => window.dispatchEvent(new Event('resize')), 240);
    });
  };
  document.addEventListener('slidechange', fire);
  window.addEventListener('load', fire);
  setTimeout(fire, 100);
  setTimeout(fire, 500);
  setTimeout(fire, 1200);
})();
</script>
<script>
(async () => {
  try { await customElements.whenDefined('deck-stage'); } catch (e) {}
  try { await document.fonts.ready; } catch (e) {}
  setTimeout(() => { try { window.print(); } catch (e) {} }, 500);
})();
</script>
